<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sedes de la Escuela</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .contenedor {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #666;
            margin-bottom: 25px;
        }

        .filtro {
            margin-bottom: 20px;
        }

        .filtro label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 280px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            font-size: 16px;
        }

        .contenido {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        #mapa {
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
        }

        .sedes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .sede {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .sede h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .dato {
            margin: 7px 0;
            color: #555;
        }

        @media (max-width: 800px) {
            .contenido {
                grid-template-columns: 1fr;
            }

            #mapa {
                height: 450px;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Nuestras sedes</h1>

    <p class="subtitulo">
        Encontrá la sede más cercana seleccionando una zona.
    </p>

    <div class="filtro">
        <label for="zona">Provincia / zona</label>

        <select id="zona">
            <option value="Todas">Todas las provincias</option>
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="Capital">Capital (CABA)</option>
            <option value="Córdoba">Córdoba</option>
            <option value="Entre Ríos">Entre Ríos</option>
            <option value="Mendoza">Mendoza</option>
            <option value="Chaco">Chaco</option>
            <option value="Santa Fe">Santa Fe</option>
            <option value="San Juan">San Juan</option>
            <option value="Río Negro">Río Negro</option>
            <option value="Tucumán">Tucumán</option>
        </select>
    </div>

    <div class="contenido">

        <!-- MAPA -->
        <div id="mapa"></div>

        <!-- LISTA DE SEDES -->
        <div class="sedes" id="listaSedes"></div>

    </div>

</div>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

        },

        },

        // 5. Asociación Tai Chi Mendoza
        {
            nombre: "Asociación Tai Chi Mendoza",
            sede: "Sede Mendoza",
            zona: "Mendoza",

        },

        // 6. Yang Taijiquan Tradicional Resistencia
        {

            sede: "Sede Resistencia",

        },

        // 7. Ling Dao Long
        {
            nombre: "Ling Dao Long",
            sede: "Casa de la Cultura",
            zona: "Córdoba",
            direccion: "Casa de la Cultura, Devoto, Córdoba",
            lat: -31.98, lon: -62.98
        },

        // 8. Yong Lu Kung Fu
        {

        // 9. Asociación Lung Chuan

        {

        {

            lat: -34.53, lon: -58.48
        },
        {
            nombre: "Club Argentino de Wushu",
            sede: "Sede Olivos",
            zona: "Buenos Aires",
            direccion: "Carlos Villate 456, Olivos, Buenos Aires",

        },
        {
            nombre: "Club Argentino de Wushu",
            sede: "Colegio Chino Hua Xia",
            zona: "Capital",
            direccion: "Av. Rivadavia 5652, CABA",
            lat: -34.62, lon: -58.43
        }

    ];


    // ==========================================
    // CREAR MAPA
    // ==========================================

    const mapa = L.map('mapa').setView(
        [-34.6037, -58.3816],
        10
    );


    // Mapa de OpenStreetMap

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(mapa);


    // Grupo de marcadores

    let grupoMarcadores = L.layerGroup().addTo(mapa);


    // ==========================================
    // MOSTRAR SEDES
    // ==========================================

    function mostrarSedes(zonaSeleccionada) {

        // Limpiar marcadores anteriores
        grupoMarcadores.clearLayers();

        // Limpiar lista
        const lista = document.getElementById("listaSedes");
        lista.innerHTML = "";


        // Filtrar sedes

        const sedesFiltradas = sedes.filter(
            sede => sede.zona === zonaSeleccionada
        );


        // Coordenadas para ajustar el mapa

        const coordenadas = [];


        // Crear cada sede

        sedesFiltradas.forEach(sede => {

            // ------------------------------
            // MARCADOR EN EL MAPA
            // ------------------------------

            const marcador = L.marker([
                sede.lat,
                sede.lon
            ]);


            // Popup del marcador

            marcador.bindPopup(`
                <strong>${sede.nombre}</strong><br>
                ${sede.direccion}<br>
                Sede: ${sede.sede}
            `);


            marcador.addTo(grupoMarcadores);


            coordenadas.push([
                sede.lat,
                sede.lon
            ]);


            // ------------------------------
            // TARJETA DE LA SEDE
            // ------------------------------

            const tarjeta = document.createElement("div");

            tarjeta.className = "sede";

            tarjeta.innerHTML = `
                <h3>${sede.nombre}</h3>

                <div class="dato">
                    📍 ${sede.direccion}
                </div>

                <div class="dato">
                    ${sede.sede}
                </div>
            `;

            lista.appendChild(tarjeta);

        });


        // ==================================
        // AJUSTAR MAPA A LAS SEDES
        // ==================================

        if (coordenadas.length > 0) {

            const limites = L.latLngBounds(coordenadas);

            mapa.fitBounds(limites, {
                padding: [40, 40]
            });

        }

    }


    // ==========================================
    // CAMBIO DE ZONA
    // ==========================================

    document
        .getElementById("zona")
        .addEventListener("change", function() {

            mostrarSedes(this.value);

        });


    // ==========================================
    // CARGAR ZONA INICIAL
    // ==========================================

    mostrarSedes("Buenos Aires");

</script>

</body>
</html>
